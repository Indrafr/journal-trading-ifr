<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Trading Forex Sederhana</title>
    <!-- Menggunakan Tailwind CSS untuk styling yang rapi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library pembaca CSV (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">📊 Jurnal Trading Forex Otomatis</h1>
        <p class="text-gray-600 mb-6">Unggah file laporan riwayat transaksi Anda (format CSV) dari MetaTrader 5 untuk melihat jurnal harian.</p>

        <!-- Input File CSV -->
        <div class="mb-6 p-4 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50">
            <label class="block text-sm font-medium text-gray-700 mb-2">Pilih File Laporan MT5 (.csv):</label>
            <input type="file" id="csvFile" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- Tabel Jurnal -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Waktu</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Order</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Symbol</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Volume</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Profit ($)</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200 text-sm">
                    <tr>
                        <td colspan="7" class="px-4 py-4 text-center text-gray-400">Belum ada data yang diunggah.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const data = results.data;
                    const tbody = document.getElementById('tableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-4 text-center text-gray-400">File kosong atau format salah.</td></tr>';
                        return;
                    }

                    data.forEach(row => {
                        // Sesuaikan nama kolom dengan format CSV riwayat MT5 Anda
                        const time = row['Time'] || row['Open Time'] || '-';
                        const order = row['Order'] || '-';
                        const type = row['Type'] || '-';
                        const symbol = row['Symbol'] || '-';
                        const volume = row['Volume'] || '-';
                        const price = row['Price'] || row['Open Price'] || '-';
                        const profit = row['Profit'] || '0';

                        const profitClass = parseFloat(profit) >= 0 ? 'text-green-600 font-semibold' : 'text-red-600 font-semibold';

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="px-4 py-2 whitespace-nowrap text-gray-700">${time}</td>
                            <td class="px-4 py-2 whitespace-nowrap text-gray-700">${order}</td>
                            <td class="px-4 py-2 whitespace-nowrap text-gray-700">${type}</td>
                            <td class="px-4 py-2 whitespace-nowrap text-gray-700 font-bold">${symbol}</td>
                            <td class="px-4 py-2 whitespace-nowrap text-gray-700">${volume}</td>
                            <td class="px-4 py-2 whitespace-nowrap text-gray-700">${price}</td>
                            <td class="px-4 py-2 whitespace-nowrap ${profitClass}">${profit}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            });
        });
    </script>
</body>
</html>
