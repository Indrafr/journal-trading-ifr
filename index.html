<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal Trading Forex Sederhana</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">
    <div class="max-w-6xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">📊 Jurnal Trading Forex Otomatis</h1>
        <p class="text-gray-600 mb-6">Unggah file laporan riwayat transaksi MT5 (format .html atau .csv) untuk melihat jurnal harian.</p>

        <!-- Input File -->
        <div class="mb-6 p-4 border-2 border-dashed border-gray-300 rounded-lg bg-gray-50">
            <label class="block text-sm font-medium text-gray-700 mb-2">Pilih File Laporan MT5 (.html / .csv):</label>
            <input type="file" id="reportFile" accept=".html,.htm,.csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <!-- Tabel Jurnal -->
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200 border">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Waktu</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Order</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Symbol</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Volume</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Price</th>
                        <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Profit ($)</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="bg-white divide-y divide-gray-200 text-sm">
                    <tr>
                        <td colspan="7" class="px-4 py-4 text-center text-gray-400">Belum ada data yang diunggah.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('reportFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const htmlContent = event.target.result;
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlContent, 'text/html');
                
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = '';

                // MT5 HTML report biasanya menyimpan data transaksi di dalam tabel (tag <table>)
                // Kita cari baris-baris (tr) di dalam dokumen HTML laporan
                const rows = doc.querySelectorAll('table tr');
                let foundData = false;

                rows.forEach((tr, index) => {
                    const cols = tr.querySelectorAll('td');
                    // Biasanya baris transaksi MT5 memiliki lebih dari 5 kolom
                    if (cols.length >= 6) {
                        const textData = Array.from(cols).map(col => col.innerText.trim());
                        
                        // Cek apakah baris ini berisi data transaksi (bukan header)
                        // Contoh format MT5: Time, Order, Type, Symbol, Volume, Price, ... , Profit
                        if (textData[0].match(/^\d{4}\.\d{2}\.\d{2}/)) {
                            foundData = true;
                            const time = textData[0] || '-';
                            const order = textData[1] || '-';
                            const type = textData[2] || '-';
                            const symbol = textData[3] || '-';
                            const volume = textData[4] || '-';
                            const price = textData[5] || '-';
                            const profit = textData[textData.length - 1] || '0'; // Biasanya profit ada di kolom terakhir

                            const profitNum = parseFloat(profit.replace(/\s/g, '').replace(',', ''));
                            const profitClass = !isNaN(profitNum) && profitNum >= 0 ? 'text-green-600 font-semibold' : 'text-red-600 font-semibold';

                            const newTr = document.createElement('tr');
                            newTr.innerHTML = `
                                <td class="px-4 py-2 whitespace-nowrap text-gray-700">${time}</td>
                                <td class="px-4 py-2 whitespace-nowrap text-gray-700">${order}</td>
                                <td class="px-4 py-2 whitespace-nowrap text-gray-700">${type}</td>
                                <td class="px-4 py-2 whitespace-nowrap text-gray-700 font-bold">${symbol}</td>
                                <td class="px-4 py-2 whitespace-nowrap text-gray-700">${volume}</td>
                                <td class="px-4 py-2 whitespace-nowrap text-gray-700">${price}</td>
                                <td class="px-4 py-2 whitespace-nowrap ${profitClass}">${profit}</td>
                            `;
                            tbody.appendChild(newTr);
                        }
                    }
                });

                if (!foundData) {
                    tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-4 text-center text-gray-400">Format laporan tidak dikenali atau tidak ada data transaksi.</td></tr>';
                }
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
